version: 2

project_name: peeporun

before:
  hooks:
    - go mod tidy

builds:
  - id: peeporun
    main: .
    binary: peeporun
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64
    ldflags:
      - -s -w -X main.version={{ .Version }}

archives:
  - id: default
    ids:
      - peeporun
    name_template: >-
      {{ .ProjectName }}_{{ .Os }}_{{ .Arch }}
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    files:
      - README.md

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"

brews:
  - name: peeporun
    ids:
      - default
    repository:
      owner: cometpuppy
      name: homebrew-peeporun
      branch: main
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    directory: Formula
    homepage: "https://github.com/cometpuppy/peeporun"
    description: "A TUI hit counter for Dark Souls, with OBS overlay and theme support"
    install: |
      bin.install "peeporun"
    test: |
      system "#{bin}/peeporun", "--version"

release:
  github:
    owner: cometpuppy
    name: peeporun
